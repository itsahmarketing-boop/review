<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AH Marketing</title>
<style>html,body{margin:0;height:100%;background:#0b0a14;color:#eeecf7;font-family:system-ui,sans-serif}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:15px}
#ld i{width:42px;height:42px;border-radius:50%;border:4px solid #2b2546;border-top-color:#8b6cff;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head>
<body><div id="ld"><i></i><span>লোড হচ্ছে…</span></div>
<script>
/* অ্যাপের পাতা GitHub থেকে দেখানো হয়, কাজ হয় Apps Script এ; Google লগইন বা কুকি লাগে না, তাই কোনো ফোনে "unable to open" আসে না */
var APP='https://script.google.com/macros/s/AKfycbxU3xAnzPlI9-0BO_MAcJVt5gMT2_-m1ZtgiiqBO_HwlMkBkBeB_dFu8jpzW1kE9z6ImQ/exec';
var q=location.search?location.search+'&raw=1':'?raw=1';
function old(){var f=document.createElement('iframe');f.src=APP+location.search;document.body.appendChild(f);}
fetch(APP+q,{credentials:'omit'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(h){if(!/<html|<!doctype|<div|<body/i.test(h.slice(0,600))){document.getElementById('ld').innerHTML='<span>'+h.replace(/[<>&]/g,'')+'</span>';return;}document.open();document.write(h);document.close();})
.catch(old);
</script>
</body></html>
